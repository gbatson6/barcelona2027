name: Update Indian wedding tile

on:
  push:
    paths:
      - .github/workflows/update-indian-wedding-tile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update home tile and section label
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_tile = '<li><a class="tile" href="#schedule"><span><span class="tile__title">Schedule</span><span class="tile__desc">What’s happening, and where</span></span><i class="arr" aria-hidden="true"></i></a></li>'
          new_tile = '<li><a class="tile" href="#schedule"><span><span class="tile__title">Indian Wedding</span><span class="tile__desc">A quick guide to the traditions you’ll experience</span></span><i class="arr" aria-hidden="true"></i></a></li>'

          if old_tile not in s:
              raise SystemExit('Could not find the Schedule home tile')
          s = s.replace(old_tile, new_tile, 1)
          s = s.replace('id="schedule" data-title="Schedule"', 'id="schedule" data-title="Indian Wedding"', 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Rename schedule tile to Indian Wedding"
          git push
