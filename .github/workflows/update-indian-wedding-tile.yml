name: Remove Indian wedding section

on:
  push:
    paths:
      - .github/workflows/update-indian-wedding-tile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove home tile and Indian wedding section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Remove the Indian Wedding tile from the home page.
          s, tile_count = re.subn(
              r'\s*<li><a class="tile" href="#schedule">.*?<span class="tile__title">Indian Wedding</span>.*?</a></li>',
              '',
              s,
              count=1,
              flags=re.S,
          )

          # Remove the full Indian wedding section.
          s, section_count = re.subn(
              r'\s*<!-- ================= SCHEDULE ================= -->\s*<section class="view" id="schedule".*?</section>',
              '',
              s,
              count=1,
              flags=re.S,
          )

          if tile_count != 1:
              raise SystemExit(f'Expected to remove 1 Indian Wedding tile, removed {tile_count}')
          if section_count != 1:
              raise SystemExit(f'Expected to remove 1 Indian Wedding section, removed {section_count}')

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove Indian wedding section"
          git push
