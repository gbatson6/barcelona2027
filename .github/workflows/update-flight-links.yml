name: Update flight links

on:
  push:
    paths:
      - .github/workflows/update-flight-links.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace static flight prices with Google Flights links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          url = 'https://www.google.com/travel/flights?hl=en&curr=USD&q=Flights%20from%20ORD%20to%20BCN%20on%20May%2010%202027%20returning%20May%2014%202027'

          s = s.replace(
              'Prices are round-trip Economy planning estimates and can change.',
              'Use the live Google Flights links below to check current fares and availability.'
          )
          s = s.replace('<span>Economy</span></div>', '<span>Live fares</span></div>')

          replacement = (
              '<p class="flight__price">'
              f'<a class="textlink" href="{url}" target="_blank" rel="noopener noreferrer">'
              'Check live fares <span class="sr">on Google Flights (opens in a new tab)</span>'
              '</a></p>'
          )
          s = re.sub(r'<p class="flight__price">.*?</p>', replacement, s)
          s = s.replace(
              'Pricing checked October 2026. Flight schedules and fares can change. Always confirm details before booking.',
              'Flight schedules and availability can change. Always confirm details before booking.'
          )
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace flight prices with live Google Flights links"
          git push
