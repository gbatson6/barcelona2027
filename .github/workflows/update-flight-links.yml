name: Update flight preferences

on:
  push:
    paths:
      - .github/workflows/update-flight-links.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark all listed flight options as preferred
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Only change flight cards that do not already have the Preferred badge.
          def make_preferred(match):
              block = match.group(0)
              if 'tag--pref' in block:
                  return block
              block = block.replace('class="flight"', 'class="flight is-preferred"', 1)
              block = re.sub(
                  r'<p class="flight__tags">',
                  '<p class="flight__tags"><span class="tag tag--pref"><span aria-hidden="true">★</span> Preferred</span>',
                  block,
                  count=1,
              )
              # Remove the old plain-star badge if present so we do not show two stars.
              block = re.sub(r'<span class="tag tag--star">.*?</span>', '', block, count=1)
              return block

          flights_start = s.index('<!-- ================= FLIGHTS ================= -->')
          flights_end = s.index('</section>', flights_start) + len('</section>')
          before, flights, after = s[:flights_start], s[flights_start:flights_end], s[flights_end:]
          flights = re.sub(r'<li class="flight(?: is-preferred)?">.*?</li>', make_preferred, flights, flags=re.S)
          p.write_text(before + flights + after)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mark all flight options as preferred"
          git push
