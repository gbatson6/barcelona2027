name: Update Indian wedding overview

on:
  push:
    paths:
      - '.github/workflows/update-flight-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update schedule section
        run: python .github/scripts/update_schedule.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace schedule with Indian wedding overview"
          git push
