name: Update preferred flight badges

on:
  push:
    paths:
      - .github/workflows/update-flight-links.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set selected preferred flight badges
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          flights_start = s.index('<!-- ================= FLIGHTS ================= -->')
          flights_end = s.index('</section>', flights_start) + len('</section>')
          before, flights, after = s[:flights_start], s[flights_start:flights_end], s[flights_end:]

          seen = {}

          def restore(match):
              block = match.group(0)
              m = re.search(r'<h4 class="flight__airline">(.*?)</h4>', block)
              if not m:
                  return block
              airline = re.sub('<.*?>', '', m.group(1)).strip()
              seen[airline] = seen.get(airline, 0) + 1
              occurrence = seen[airline]

              preferred = (
                  airline in {'United', 'American', 'KLM', 'Lufthansa', 'British Airways'} or
                  (airline == 'SWISS' and occurrence == 1)
              )

              # Reset card style and old badges first.
              block = block.replace('class="flight is-preferred"', 'class="flight"', 1)
              block = re.sub(r'<span class="tag tag--pref"><span aria-hidden="true">★</span> Preferred</span>', '', block)
              block = re.sub(r'<span class="tag tag--star"><span aria-hidden="true">★</span><span class="sr">Starred option</span></span>', '', block)

              if preferred:
                  block = block.replace('class="flight"', 'class="flight is-preferred"', 1)
                  block = block.replace(
                      '<p class="flight__tags">',
                      '<p class="flight__tags"><span class="tag tag--pref"><span aria-hidden="true">★</span> Preferred</span>',
                      1,
                  )
              return block

          flights = re.sub(r'<li class="flight(?: is-preferred)?">.*?</li>', restore, flights, flags=re.S)
          p.write_text(before + flights + after)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mark Lufthansa and British Airways preferred"
          git push
