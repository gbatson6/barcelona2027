name: Revert olive design accents

on:
  push:
    paths:
      - .github/workflows/add-olive-design.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove olive design pass
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          marker = '/* ===== Olive design pass ===== */'
          if marker not in s:
              raise SystemExit('Olive design pass not found')

          start = s.index(marker)
          end = s.index('</style>', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Revert olive design accents"
          git push
