name: Add olive design accents

on:
  push:
    paths:
      - .github/workflows/add-olive-design.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add formal olive and vine green accents
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          marker = '/* ===== Olive design pass ===== */'
          css = """
          /* ===== Olive design pass ===== */
          :root {
            --olive-deep: #5F6338;
            --olive: #73794A;
            --olive-soft: #D9DDC3;
            --olive-wash: #F1F2E7;
          }

          .tile__desc,
          .leg__label,
          .event__date,
          .sub,
          .acc__note,
          .note,
          .note--tight,
          .flights__head,
          dt {
            color: var(--olive-deep);
          }

          .tile,
          .acc,
          .note-card,
          .flight,
          .event {
            border-color: #D8D9C3;
          }

          .tile:hover,
          .tile:focus-visible,
          .acc[open] {
            border-color: var(--olive);
          }

          .tag:not(.tag--pref),
          .pill,
          .swatches .sw {
            background: var(--olive-wash);
            border-color: var(--olive-soft);
          }

          .tag--soft {
            color: var(--olive-deep);
            background: var(--olive-soft);
          }

          .note-card {
            background: linear-gradient(180deg, rgba(241,242,231,.76), rgba(255,250,246,.96));
          }

          blockquote.quote {
            border-left-color: var(--olive);
            background: rgba(241,242,231,.55);
          }

          .viewnav .btn--ghost,
          .btn--ghost {
            border-color: var(--olive);
            color: var(--olive-deep);
          }

          .viewnav .btn--ghost:hover,
          .viewnav .btn--ghost:focus-visible,
          .btn--ghost:hover,
          .btn--ghost:focus-visible {
            background: var(--olive-wash);
          }
          """
          css = '\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines())

          if marker in s:
              raise SystemExit('Olive design pass already exists')
          if '</style>' not in s:
              raise SystemExit('Could not find </style>')

          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add formal olive design accents"
          git push
